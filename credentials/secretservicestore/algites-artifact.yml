# $schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/algites-artifact_1.yamldef.schema.json
$schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/algites-artifact_1.yamldef.schema.json

Artifact:
  TechnologyKinds: [java]
  Name: Algites Secret Service credential store
  Description: Freedesktop Secret Service backend for Algites credentials on Linux desktops.
Dependencies:
  - DependencyKind: modustro
    Items:
      - GroupId: eu.algites.lib.security
        ArtifactId: pub.lib.Security_credentials.coreintf
        Usages: [product_implementation]
        VersionRequirement:
          Exact: "1.0-SNAPSHOT"
  - DependencyKind: java
    Items:
      - GroupId: de.swiesend
        ArtifactId: secret-service
        Usages: [product_implementation]
        VersionRequirement:
          Exact: "3.0.0-alpha"
      - GroupId: org.testng
        ArtifactId: testng
        Usages: [develop_implementation]
        VersionRequirement:
          Exact: "7.11.0"
