# $schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/algites-artifact_1.yamldef.schema.json
$schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/algites-artifact_1.yamldef.schema.json

Artifact:
  Name: Algites credential core implementation
  Description: General credential resolution, document, codec, and secure-store selection implementation.
# Disabled, because winstore, macstore and secretservicestore do not have python implementations, so the project would be uncompilable
#  TechnologyKinds: [java, python]
  TechnologyKinds: [java]
Dependencies:
  - DependencyKind: modustro
    Items:
      - GroupId: eu.algites.lib.security
        ArtifactId: pub.lib.Security_credentials.coreintf
        Usages: [product_api]
        VersionRequirement:
          Exact: "1.0-SNAPSHOT"

      - GroupId: eu.algites.lib.security
        ArtifactId: pub.lib.Security_credentials.winstore
        Usages: [product_runtime_only]
        VersionRequirement:
          Exact: "1.0-SNAPSHOT"

      - GroupId: eu.algites.lib.security
        ArtifactId: pub.lib.Security_credentials.macstore
        Usages: [product_runtime_only]
        VersionRequirement:
          Exact: "1.0-SNAPSHOT"

      - GroupId: eu.algites.lib.security
        ArtifactId: pub.lib.Security_credentials.secretservicestore
        Usages: [product_runtime_only]
        VersionRequirement:
          Exact: "1.0-SNAPSHOT"

  - DependencyKind: java
    Items:
      - GroupId: com.fasterxml.jackson.core
        ArtifactId: jackson-databind
        Usages: [product_implementation]
        VersionRequirement:
          Exact: "2.18.2"

      - GroupId: com.fasterxml.jackson.dataformat
        ArtifactId: jackson-dataformat-yaml
        Usages: [product_implementation]
        VersionRequirement:
          Exact: "2.18.2"

      - GroupId: org.testng
        ArtifactId: testng
        Usages: [develop_implementation]
        VersionRequirement:
          Exact: "7.11.0"
