# $schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/algites-artifact_1.yamldef.schema.json
$schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/algites-artifact_1.yamldef.schema.json

Artifact:
  TechnologyKinds: [java]
  Name: Algites Windows credential store
  Description: Windows Credential Manager backend for Algites credentials.
Dependencies:
  - DependencyKind: modustro
    Items:
      - GroupId: eu.algites.lib.security
        ArtifactId: pub.lib.Security_credentials.coreintf
        Usages: [product_implementation]
        VersionRequirement:
          Exact: "1.0-SNAPSHOT"
  - DependencyKind: java
    Items:
      - GroupId: net.java.dev.jna
        ArtifactId: jna
        Usages: [product_implementation]
        VersionRequirement:
          Exact: "5.19.1"
      - GroupId: org.testng
        ArtifactId: testng
        Usages: [develop_implementation]
        VersionRequirement:
          Minimum: ">=7.0.0"
          Maximum: "<8.0.0"
          MaximumStrict: true
